name: mars-trace
services:
  gateway:
    build:
      context: ../..
      dockerfile: teaching/deploy/Dockerfile
      target: gateway
    environment:
      MARS_GATEWAY_TOKEN: ${MARS_GATEWAY_TOKEN:?Run teaching/scripts/teacher.sh init first}
      MARS_SECURE_COOKIE: ${MARS_SECURE_COOKIE:-1}
      MARS_MAX_SESSIONS: ${MARS_MAX_SESSIONS:-8}
      MARS_IDLE_SECONDS: ${MARS_IDLE_SECONDS:-600}
      MARS_COMMAND_TIMEOUT: ${MARS_COMMAND_TIMEOUT:-20}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${MARS_MEMORY_LIMIT:-2800m}
    pids_limit: 256
    networks: [execution]
    healthcheck:
      test: [CMD, python3, -c, "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8767/health', headers={'Authorization':'Bearer '+os.environ['MARS_GATEWAY_TOKEN']}), timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3
  web:
    build:
      context: ../..
      dockerfile: teaching/deploy/Dockerfile
      target: web
    environment:
      MARS_SITE_ADDRESS: ${MARS_SITE_ADDRESS:-http://localhost}
      MARS_GATEWAY_TOKEN: ${MARS_GATEWAY_TOKEN:?Run teaching/scripts/teacher.sh init first}
    ports:
      - "${MARS_HTTP_PORT:-8080}:80"
      - "${MARS_HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, execution]
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
networks:
  edge: {}
  execution:
    internal: true
volumes:
  caddy_data: {}
  caddy_config: {}
